<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job and Lead Crawler{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2024; --muted:#6b7280; --border:#e3e6ea; --accent:#2563eb;
          --good:#15803d; --warn:#b45309; --bad:#b91c1c; --chip:#eef0f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111316; --panel:#1a1d21; --text:#e6e8eb; --muted:#9aa1ab; --border:#2b3036; --accent:#60a5fa;
            --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#2b3036; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px 48px; }
  nav { display:flex; gap:16px; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap; }
  nav .brand { font-weight:700; margin-right:auto; color:var(--text); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  h1 { font-size:22px; margin:0 0 12px; } h2 { font-size:17px; margin:24px 0 8px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin:10px 0; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .row { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .score { font-weight:700; font-variant-numeric:tabular-nums; min-width:44px; }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:1px 9px; font-size:12px; }
  .chip.warn { color:var(--warn); } .chip.bad { color:var(--bad); } .chip.good { color:var(--good); }
  .notice { border-left:4px solid var(--accent); } .notice.error { border-left-color:var(--bad); }
  form.inline { display:inline; }
  input[type=text], input[type=url], input[type=number], select, textarea {
    font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 9px; }
  input[type=text], input[type=url], textarea { width:100%; }
  textarea { min-height:220px; }
  button { font:inherit; border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { display:block; margin:10px 0 4px; font-weight:600; font-size:14px; }
  label.check { display:inline; font-weight:normal; margin-right:14px; }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  pre.text { white-space:pre-wrap; word-wrap:break-word; font:inherit; margin:0; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <a class="brand" href="/">Job and Lead Crawler</a>
  <a href="/add">Add</a>
  <a href="/profile">Profile</a>
  <a href="/labels.jsonl">Export labels</a>
</nav>
{% block content %}{% endblock %}
</div>
</body>
</html>
